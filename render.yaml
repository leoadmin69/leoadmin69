# Mise en ligne GRATUITE de « Lyon 1 · La Doua en lutte » (dossier lyon1-lutte/) sur Render.
# Render → New → Blueprint → choisir ce dépôt. Les valeurs marquées sync: false sont demandées à la création.
# Adresse fournie automatiquement : https://ladoua-en-lutte.onrender.com (pas besoin de nom de domaine).
# La formule gratuite n'a pas de disque : les données et fichiers sont gardés dans Supabase (gratuit aussi).
services:
  - type: web
    name: ladoua-en-lutte
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./lyon1-lutte/Dockerfile
    dockerContext: ./lyon1-lutte
    # Ne redéploie que quand le site change (pas pour les autres projets du dépôt)
    buildFilter:
      paths:
        - lyon1-lutte/**
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      # Stockage permanent gratuit (obligatoire avec la formule gratuite)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # IA gratuites
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Canal Instagram officiel : lecture automatique des informations de mobilisation
      - key: INSTAGRAM_CHANNEL_ENABLED
        value: "false"
      - key: INSTAGRAM_CHANNEL_URL
        value: "https://www.instagram.com/channel/UFc6KiIvKuUCSwgk/"
      - key: INSTAGRAM_CHANNEL_INTERVAL_MINUTES
        value: "15"
      - key: INSTAGRAM_CHANNEL_COOKIES
        sync: false
      # Emails gratuits sans nom de domaine (facultatif : les notifications téléphone suffisent)
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false
      # Chaîne Telegram remplie automatiquement (facultatif, recommandé)
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        value: "@ladoualyon1"
      - key: TELEGRAM_URL
        value: https://t.me/ladoualyon1
