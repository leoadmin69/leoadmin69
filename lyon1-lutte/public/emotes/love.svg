<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"><style>.tear,.steam,.zz,.wave,.hop,.drop,.blink{transform-box:fill-box;transform-origin:center}.flag{transform-box:fill-box}.m{animation:m 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes m{0%,40%,100%{transform:scale(1)}10%,30%{transform:scale(1.13)}20%{transform:scale(1.02)}}.tear{animation:tear 1.3s ease-in infinite}.tear.t2{animation-delay:.65s}@keyframes tear{0%{transform:translateY(-3px);opacity:0}20%{opacity:1}100%{transform:translateY(9px);opacity:0}}.steam{animation:steam 2s ease-in-out infinite}.steam.s2{animation-delay:.6s}.steam.s3{animation-delay:1.2s}@keyframes steam{0%{transform:translateY(4px);opacity:0}40%{opacity:1}100%{transform:translateY(-6px);opacity:0}}.zz{animation:zz 2.4s ease-in-out infinite}.zz.z2{animation-delay:1.2s}@keyframes zz{0%{transform:translate(-3px,6px);opacity:0}30%{opacity:1}100%{transform:translate(3px,-5px);opacity:0}}.wave{animation:wave 1s ease-out infinite}.wave.w2{animation-delay:.3s}@keyframes wave{0%{opacity:0;transform:translateX(-3px)}40%{opacity:1}100%{opacity:0;transform:translateX(3px)}}.hop{animation:hop 1.2s cubic-bezier(.3,1.6,.6,1) infinite}.hop.h2{animation-delay:.4s}.hop.h3{animation-delay:.8s}@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}.drop{animation:drop 1.8s ease-in infinite}@keyframes drop{0%,20%{transform:translateY(-6px)}70%,100%{transform:translateY(6px)}}.flag{animation:flag 1.6s ease-in-out infinite;transform-origin:left center}@keyframes flag{0%,100%{transform:skewY(0)}50%{transform:skewY(-4deg) scaleY(1.03)}}.glint{animation:glint 2.2s ease-in-out infinite}@keyframes glint{0%,60%,100%{opacity:.25}75%{opacity:1}}.blink{animation:blink 3s infinite}@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="m"><circle cx="32" cy="33" r="27" fill="#ffb3c7" stroke="#14141a" stroke-width="3.2"/><path d="M12 42a27 27 0 0 0 40 0a24 24 0 0 1-40 0z" fill="#ff7aa2" opacity=".55"/><ellipse cx="22" cy="17" rx="7" ry="3.5" fill="#fff" opacity=".45" transform="rotate(-25 22 17)"/><path transform="translate(22 28) scale(0.95)" d="M0 6C-9-1-8-9-3-9c2 0 3 1 3 3c0-2 1-3 3-3c5 0 6 8-3 15z" fill="#ff3b5c" stroke="#14141a" stroke-width="2.32" stroke-linejoin="round"/><path transform="translate(42 28) scale(0.95)" d="M0 6C-9-1-8-9-3-9c2 0 3 1 3 3c0-2 1-3 3-3c5 0 6 8-3 15z" fill="#ff3b5c" stroke="#14141a" stroke-width="2.32" stroke-linejoin="round"/><path d="M20 40q12 11 24 0" fill="none" stroke="#14141a" stroke-width="3.2" stroke-linecap="round"/></g></svg>