<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"><style>.tear,.steam,.zz,.wave,.hop,.drop,.blink{transform-box:fill-box;transform-origin:center}.flag{transform-box:fill-box}.m{animation:m 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@keyframes m{0%,60%,100%{transform:translateY(0) scale(1)}70%{transform:translateY(-6px) scale(1.05,0.95)}80%{transform:translateY(0) scale(1.06,0.94)}}.tear{animation:tear 1.3s ease-in infinite}.tear.t2{animation-delay:.65s}@keyframes tear{0%{transform:translateY(-3px);opacity:0}20%{opacity:1}100%{transform:translateY(9px);opacity:0}}.steam{animation:steam 2s ease-in-out infinite}.steam.s2{animation-delay:.6s}.steam.s3{animation-delay:1.2s}@keyframes steam{0%{transform:translateY(4px);opacity:0}40%{opacity:1}100%{transform:translateY(-6px);opacity:0}}.zz{animation:zz 2.4s ease-in-out infinite}.zz.z2{animation-delay:1.2s}@keyframes zz{0%{transform:translate(-3px,6px);opacity:0}30%{opacity:1}100%{transform:translate(3px,-5px);opacity:0}}.wave{animation:wave 1s ease-out infinite}.wave.w2{animation-delay:.3s}@keyframes wave{0%{opacity:0;transform:translateX(-3px)}40%{opacity:1}100%{opacity:0;transform:translateX(3px)}}.hop{animation:hop 1.2s cubic-bezier(.3,1.6,.6,1) infinite}.hop.h2{animation-delay:.4s}.hop.h3{animation-delay:.8s}@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}.drop{animation:drop 1.8s ease-in infinite}@keyframes drop{0%,20%{transform:translateY(-6px)}70%,100%{transform:translateY(6px)}}.flag{animation:flag 1.6s ease-in-out infinite;transform-origin:left center}@keyframes flag{0%,100%{transform:skewY(0)}50%{transform:skewY(-4deg) scaleY(1.03)}}.glint{animation:glint 2.2s ease-in-out infinite}@keyframes glint{0%,60%,100%{opacity:.25}75%{opacity:1}}.blink{animation:blink 3s infinite}@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="m"><path d="M32 6c-14 0-24 9-24 22c0 8 4 13 9 16v8c0 3 2 5 5 5h20c3 0 5-2 5-5v-8c5-3 9-8 9-16C56 15 46 6 32 6z" fill="#f2f2f7" stroke="#14141a" stroke-width="3.2" stroke-linejoin="round"/><path d="M14 26q6-6 12 1q-6 7-12-1zM38 27q6-7 12-1q-6 8-12 1z" fill="#14141a"/><path d="M29 37l3-5l3 5z" fill="#14141a"/><path d="M25 50v6M32 50v7M39 50v6" stroke="#14141a" stroke-width="2.4" stroke-linecap="round"/><ellipse cx="22" cy="14" rx="6" ry="3" fill="#fff" transform="rotate(-25 22 14)"/></g></svg>