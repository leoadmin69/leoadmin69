<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"><style>.tear,.steam,.zz,.wave,.hop,.drop,.blink{transform-box:fill-box;transform-origin:center}.flag{transform-box:fill-box}.m{animation:m 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@keyframes m{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}.tear{animation:tear 1.3s ease-in infinite}.tear.t2{animation-delay:.65s}@keyframes tear{0%{transform:translateY(-3px);opacity:0}20%{opacity:1}100%{transform:translateY(9px);opacity:0}}.steam{animation:steam 2s ease-in-out infinite}.steam.s2{animation-delay:.6s}.steam.s3{animation-delay:1.2s}@keyframes steam{0%{transform:translateY(4px);opacity:0}40%{opacity:1}100%{transform:translateY(-6px);opacity:0}}.zz{animation:zz 2.4s ease-in-out infinite}.zz.z2{animation-delay:1.2s}@keyframes zz{0%{transform:translate(-3px,6px);opacity:0}30%{opacity:1}100%{transform:translate(3px,-5px);opacity:0}}.wave{animation:wave 1s ease-out infinite}.wave.w2{animation-delay:.3s}@keyframes wave{0%{opacity:0;transform:translateX(-3px)}40%{opacity:1}100%{opacity:0;transform:translateX(3px)}}.hop{animation:hop 1.2s cubic-bezier(.3,1.6,.6,1) infinite}.hop.h2{animation-delay:.4s}.hop.h3{animation-delay:.8s}@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}.drop{animation:drop 1.8s ease-in infinite}@keyframes drop{0%,20%{transform:translateY(-6px)}70%,100%{transform:translateY(6px)}}.flag{animation:flag 1.6s ease-in-out infinite;transform-origin:left center}@keyframes flag{0%,100%{transform:skewY(0)}50%{transform:skewY(-4deg) scaleY(1.03)}}.glint{animation:glint 2.2s ease-in-out infinite}@keyframes glint{0%,60%,100%{opacity:.25}75%{opacity:1}}.blink{animation:blink 3s infinite}@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="m"><circle cx="32" cy="33" r="27" fill="#fff7ef" stroke="#14141a" stroke-width="3.2"/><path d="M12 42a27 27 0 0 0 40 0a24 24 0 0 1-40 0z" fill="#f1d9c4" opacity=".55"/><ellipse cx="22" cy="17" rx="7" ry="3.5" fill="#fff" opacity=".45" transform="rotate(-25 22 17)"/><path d="M6 26q-2-10 8-14q-6 8-1 14zM58 26q2-10-8-14q6 8 1 14z" fill="#ff3b30"/><g class="blink"><circle cx="22" cy="27" r="3" fill="#14141a"/><circle cx="42" cy="27" r="3" fill="#14141a"/></g><circle cx="32" cy="35" r="5" fill="#ff3b30" stroke="#14141a" stroke-width="2.2"/><path d="M19 43q13 12 26 0" fill="#ff3b30" stroke="#14141a" stroke-width="2.6"/><path d="M18 22l5-6l5 6M36 22l5-6l5 6" fill="none" stroke="#0a84ff" stroke-width="2"/></g></svg>